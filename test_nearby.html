<!DOCTYPE html>
<html>
<head>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6JwFLApTP1XlzZVn_E7SAl2ezmrm2_zg&libraries=places"></script>
    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: 8.4772, lng: 124.6459},
                zoom: 18
            });
            const placesService = new google.maps.places.PlacesService(map);
            placesService.nearbySearch({
                location: { lat: 8.4772, lng: 124.6459 },
                rankBy: google.maps.places.RankBy.DISTANCE
            }, (results, status) => {
                console.log("Nearby Search Status:", status);
                console.log("Results:", results);
                document.getElementById('out').innerText = "Status: " + status;
            });
        }
    </script>
</head>
<body onload="initMap()">
    <div id="map" style="display:none;"></div>
    <div id="out"></div>
</body>
</html>
