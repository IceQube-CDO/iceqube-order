<!DOCTYPE html>
<html>
<head>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6JwFLApTP1XlzZVn_E7SAl2ezmrm2_zg&libraries=places"></script>
    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: 8.4879555, lng: 124.6394541}, // Guessing coords of Green Village CDO / ZZ Loft
                zoom: 18
            });
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: "ZZ LOFT, Cagayan de Oro" }, (results, status) => {
                if (status === "OK") {
                    const loc = results[0].geometry.location;
                    document.getElementById('out').innerText += "\nGeocode ZZ LOFT: " + loc.lat() + ", " + loc.lng();
                    
                    const placesService = new google.maps.places.PlacesService(map);
                    placesService.nearbySearch({
                        location: loc,
                        radius: 50
                    }, (pResults, pStatus) => {
                        document.getElementById('out').innerText += "\nPlaces nearby: " + pResults.map(p => p.name + " (" + p.types.join(',') + ")").join(' | ');
                    });
                    
                    geocoder.geocode({ location: loc }, (gResults, gStatus) => {
                        document.getElementById('out').innerText += "\nReverse Geocode: " + gResults.map(g => g.formatted_address + " (" + g.types.join(',') + ")").join(' | ');
                        console.log("Reverse Geocode:", gResults);
                    });
                } else {
                    document.getElementById('out').innerText = "Geocode failed: " + status;
                }
            });
        }
    </script>
</head>
<body onload="initMap()">
    <div id="map" style="display:none;"></div>
    <pre id="out"></pre>
</body>
</html>
