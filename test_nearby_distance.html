<!DOCTYPE html>
<html>
<head>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC6JwFLApTP1XlzZVn_E7SAl2ezmrm2_zg&libraries=places"></script>
    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: 8.4879555, lng: 124.6394541},
                zoom: 18
            });
            const placesService = new google.maps.places.PlacesService(map);
            placesService.nearbySearch({
                location: {lat: 8.4879555, lng: 124.6394541},
                rankBy: google.maps.places.RankBy.DISTANCE,
                type: 'point_of_interest'
            }, (results, status) => {
                document.getElementById('out').innerText = "Status: " + status + "\n" + (results ? results.map(r => r.name).join(', ') : '');
            });
        }
    </script>
</head>
<body onload="initMap()">
    <div id="map" style="display:none;"></div>
    <pre id="out"></pre>
</body>
</html>
